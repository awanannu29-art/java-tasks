
<!DOCTYPE html>
<html>
<head>
    <title>Age to Days Converter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f0f0f0;
        }

        input {
            padding: 10px;
            width: 200px;
        }

        button {
            padding: 10px 20px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        h2 {
            color: blue;
        }
    </style>
</head>
<body>

    <h1>Age to Days Converter</h1>

    <input type="number" id="age" placeholder="Enter age in years">

    <button onclick="convertAge()">Convert</button>

    <h2 id="result"></h2>

    <script>
        function convertAge() {
            let age = document.getElementById("age").value;

            if (age === "" || age < 0) {
                document.getElementById("result").innerText =
                    "Please enter a valid age!";
                return;
            }
            else{

            let days = age * 365;

            document.getElementById("result").innerText =
                "Your age in days is " + days + " days.";
        }
            }
    </script>

</body>
</html>
